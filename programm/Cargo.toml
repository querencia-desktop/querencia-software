[package]
name = "querencia-software"
version = "0.1.2"
edition = "2021"
rust-version = "1.92"
description = "Querencia Software: grafischer Software-Installer für Querencia Desktop (Oberfläche, SW-3)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Dieselben Bindings wie Editor, Bilder und Rechner (gtk-rs 0.11, Cargo.lock
# vom Rechner übernommen, damit der Bau --offline gelingt).
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
async-trait = "0.1.92"
# Gemeinsame Typen und Traits von SW-1 (Commit 637b7b0, qs_typen 0.1.0).
qs_typen.workspace = true
# Echte Backends (SW-6): PackageKit (SW-1), AppStream (SW-2), Transaktionsmonitor (SW-4).
qs_paketkit.workspace = true
qs_katalog.workspace = true
qs_transaktion.workspace = true
# Übersetzungen über GNU gettext (po/, .mo unter share/locale). Feature
# gettext-system: das gettext der glibc statt eines mitgebauten libintl.
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
